<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comunidade & Plataforma - Aviator</title>
    
    <link rel="icon" type="image/png" href="https://i.postimg.cc/yYzNXKqx/Picsart-25-10-27-10-15-31-195.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* Reset básico */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        body, html {
            height: 100%;
            overflow-x: hidden;
        }

        /* Configuração do Fundo */
        .background-container {
            background-image: url('https://i.postimg.cc/J4HPksWF/Picsart-26-02-14-15-45-49-716.jpg');
            background-size: cover;
            background-position: center top;
            background-attachment: fixed;
            min-height: 100vh;
            width: 100%;
            position: relative;
        }

        /* Camada escura ajustada (Degradê) */
        .overlay {
            background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 30%, rgba(0,0,0,0.95) 100%);
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            /* ALTERAÇÃO: Reduzido de 45vh para 15vh para subir o conteúdo */
            padding-top: 15vh; 
            text-align: center;
        }

        /* Container do Título */
        .title-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 25px; /* Aumentei um pouco a margem inferior já que tiramos o texto */
            width: 100%;
        }

        /* Estilos de Texto */
        h1, h2 {
            color: #ffffff;
            text-transform: uppercase;
            font-weight: 900;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        h1 { font-size: 1.5rem; margin-bottom: 0; }
        h2 { font-size: 1.3rem; margin-bottom: 15px; } 

        p {
            color: #eeeeee;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 20px;
            max-width: 600px;
            font-weight: 500;
        }

        /* Classe para destaque em Vermelho */
        .destaque {
            color: #ff3333;
            font-weight: 800;
            text-transform: uppercase;
        }

        /* Estilos dos Botões */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px; /* Ajustei padding lateral */
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            font-size: 0.95rem;
            width: 100%;
            max-width: 320px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s, box-shadow 0.2s;
            text-transform: uppercase;
            margin-bottom: 10px;
            border: 2px solid transparent;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn i {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Novo estilo para a Logo dentro do botão */
        .btn-logo-img {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            margin-right: 12px;
            object-fit: cover;
        }

        /* Botão Plataforma (Branco com letra preta) */
        .btn-plataforma {
            background-color: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }
        .btn-plataforma:hover {
            background-color: #e0e0e0;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
        }

        /* Botão Telegram */
        .btn-telegram {
            background-color: #0088cc;
            color: white;
            border-color: #0088cc;
        }
        .btn-telegram:hover {
            background-color: #0077b5;
            box-shadow: 0 0 20px rgba(0, 136, 204, 0.6);
        }

        /* Separador visual */
        .divider {
            width: 60%;
            height: 1px;
            background: rgba(255,255,255,0.2);
            margin: 30px 0;
        }

        /* Animação de pulso nos botões */
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        .btn {
            animation: pulse 2s infinite;
        }

        /* ALTERAÇÃO: Media Query para telas pequenas (Celular) */
        @media (max-width: 480px) {
            h1 {
                font-size: 1.2rem; /* Fonte menor no celular */
            }
            h2 {
                font-size: 1.1rem;
            }
            .btn {
                font-size: 0.85rem;
                padding: 12px 15px;
            }
            .overlay {
                padding-top: 12vh; /* Ainda mais alto em telas muito pequenas se necessário */
            }
        }

    </style>
</head>
<body>

    <div class="background-container">
        <div class="overlay">
            
            <div class="title-container">
                <h1>Plataforma utilizada no vídeo</h1>
                </div>

            <a href="https://www.sssgame33.com?code=308221" target="_blank" class="btn btn-plataforma">
                <img src="https://i.postimg.cc/05t3pZfb/Picsart-26-02-14-11-11-43-318.jpg" alt="Logo SSSGame" class="btn-logo-img">
                Cadastrar e Operar
            </a>

            <div class="divider"></div>

            <h2>Aprenda mais sobre o <span class="destaque">Aviator</span> e participe da comunidade</h2>
            
            <a href="https://t.me/+Jpx9xF34HkI4NmMx" target="_blank" class="btn btn-telegram">
                <i class="fab fa-telegram-plane"></i> Entrar no Grupo
            </a>

            <p style="margin-top: 15px;">
                Conteúdo focado em entendimento do jogo, troca de <span class="destaque">experiências</span> e <span class="destaque">aprendizado</span>. 
                No grupo, além do conteúdo, acontecem sorteios de banca de forma transparente.
            </p>
            
            <div style="height: 50px;"></div>

        </div>
    </div>
<script>
    // Bloqueia o clique direito (Menu de Contexto)
    document.addEventListener('contextmenu', event => event.preventDefault());

    // Bloqueia atalhos de teclado de desenvolvedor
    document.onkeydown = function (e) {
        // Bloqueia F12
        if (e.keyCode === 123) {
            return false;
        }
        // Bloqueia Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C
        if (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) {
            return false;
        }
        // Bloqueia Ctrl+U (Ver código fonte)
        if (e.ctrlKey && e.keyCode === 85) {
            return false;
        }
    };

    // "Middleware" de proteção: pausa a execução se o console for aberto
    (function() {
        const threshold = 160;
        setInterval(() => {
            if (window.outerWidth - window.innerWidth > threshold || 
                window.outerHeight - window.innerHeight > threshold) {
                // Se detectar console aberto, redireciona ou limpa a página
                console.log("Acesso não autorizado.");
                window.location.reload();
            }
        }, 1e3);
    })();
</script>
</body>
</html>
